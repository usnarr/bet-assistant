        annotations:
          summary: "Signal model_probability_psi is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
  - name: "tennis-telemetry"
    rules:
      - alert: "TennisScrapeTargetDown"
        expr: "up{job=~\"tennis-api|tennis-scheduler|prometheus|alertmanager\"} == 0"
        for: "2m"
        labels:
          severity: "critical"
          rule_id: "TennisScrapeTargetDown"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "A scrape target is down. Its metrics are missing, not healthy."
      - alert: "TennisApiTargetAbsent"
        expr: "absent(up{job=\"tennis-api\"})"
        for: "2m"
        labels:
          severity: "critical"
          rule_id: "TennisApiTargetAbsent"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "Prometheus has no scrape target for tennis-api."
      - alert: "TennisSchedulerTargetAbsent"
        expr: "absent(up{job=\"tennis-scheduler\"})"
        for: "2m"
        labels:
          severity: "critical"
          rule_id: "TennisSchedulerTargetAbsent"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "Prometheus has no scrape target for tennis-scheduler."
      - alert: "TennisSchedulerStale"
        expr: "time() - tennis_scheduler_last_tick_timestamp_seconds > 300 or absent(tennis_scheduler_last_tick_timestamp_seconds)"
        for: "1m"
        labels:
          severity: "critical"
          rule_id: "TennisSchedulerStale"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "The scheduler has not completed a tick recently."
      - alert: "TennisAlertEvaluationStale"
        expr: "time() - tennis_alert_evaluation_timestamp_seconds > 300 or absent(tennis_alert_evaluation_timestamp_seconds)"
        for: "1m"
        labels:
          severity: "critical"
          rule_id: "TennisAlertEvaluationStale"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "The deterministic alert evaluation has not run recently."
      - alert: "TennisSignalExpectationsAbsent"
        expr: "absent(tennis_signal_expected)"
        for: "2m"
        labels:
          severity: "critical"
          rule_id: "TennisSignalExpectationsAbsent"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "No expected signal is exported. Every signal counts as missing."
      - alert: "TennisCollectorDown"
        expr: "tennis_metrics_collector_up == 0"
        labels:
          severity: "critical"
          rule_id: "TennisCollectorDown"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "A scrape-time collector failed. Its samples are missing."
      - alert: "TennisSignalProducerDown"
        expr: "tennis_signal_producer_up == 0"
        labels:
          severity: "critical"
          rule_id: "TennisSignalProducerDown"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "A signal producer failed. Its signals are missing."
      - alert: "TennisBackupStale"
        expr: "time() - tennis_backup_last_success_timestamp_seconds{store=~\"objects|journal\"} > 900"
        labels:
          severity: "critical"
          rule_id: "TennisBackupStale"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "The newest object or journal backup is older than the RPO (15 minutes)."
      - alert: "TennisBaseBackupStale"
        expr: "time() - tennis_backup_last_success_timestamp_seconds{store=\"postgres_base\"} > 93600"
        labels:
          severity: "critical"
          rule_id: "TennisBaseBackupStale"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "The newest PostgreSQL base backup is older than 26 hours."
      - alert: "TennisBackupMissing"
        expr: "absent(tennis_backup_last_success_timestamp_seconds{store=\"postgres_base\"}) or absent(tennis_backup_last_success_timestamp_seconds{store=\"objects\"}) or absent(tennis_backup_last_success_timestamp_seconds{store=\"journal\"})"
        for: "30m"
        labels:
          severity: "critical"
          rule_id: "TennisBackupMissing"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "A store has no recovery point. A missing backup is not healthy."
      - alert: "TennisWalArchiveFailing"
        expr: "increase(tennis_wal_archive_segments{event=\"failed\"}[15m]) > 0"
        labels:
          severity: "critical"
          rule_id: "TennisWalArchiveFailing"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "PostgreSQL failed to archive a WAL segment. The RPO is at risk."
      - alert: "TennisJobFailing"
        expr: "increase(tennis_job_outcomes_total{state=~\"FAILED|EXHAUSTED\"}[15m]) > 0"
        labels:
          severity: "warning"
          rule_id: "TennisJobFailing"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "A scheduled job failed in the last 15 minutes."
      - alert: "TennisTaskFailing"
        expr: "increase(tennis_task_runs_total{state=\"FAILED\"}[15m]) > 0"
        labels:
          severity: "warning"
          rule_id: "TennisTaskFailing"
          rule_set: "f15-telemetry-rules-v2"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "An operations task failed in the last 15 minutes."
