# Generated by `tennis-ops prometheus-rules` from configs/operations/alert-rules.json.
# Do not edit. Change the rule set with a new version, then regenerate.
groups:
  - name: "tennis-signal-rules"
    rules:
      - alert: "TennisParserZeroEvents"
        expr: "tennis_signal_value{signal=\"parser_events\"} <= 0"
        labels:
          severity: "critical"
          rule_id: "parser-zero-events"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "SOURCE_STOP"
        annotations:
          summary: "The parser returned zero events. Blueprint section 34.5, critical."
          scope: "{{ $labels.scope }}"
      - alert: "TennisParserZeroEventsTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"parser_events\"} unless on (signal, scope) tennis_signal_value{signal=\"parser_events\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"parser_events\"} > 900)"
        labels:
          severity: "critical"
          rule_id: "parser-zero-events"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
          control: "SOURCE_STOP"
        annotations:
          summary: "Signal parser_events is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
      - alert: "TennisParserInvalidRecords"
        expr: "tennis_signal_value{signal=\"parser_valid_rate\"} < 0.99"
        labels:
          severity: "critical"
          rule_id: "parser-invalid-records"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "SOURCE_STOP"
        annotations:
          summary: "Schema drift or malformed records. Proposed F05 parser-drift threshold."
          scope: "{{ $labels.scope }}"
      - alert: "TennisParserInvalidRecordsTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"parser_valid_rate\"} unless on (signal, scope) tennis_signal_value{signal=\"parser_valid_rate\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"parser_valid_rate\"} > 900)"
        labels:
          severity: "critical"
          rule_id: "parser-invalid-records"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
          control: "SOURCE_STOP"
        annotations:
          summary: "Signal parser_valid_rate is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
      - alert: "TennisParserDuplicateSelections"
        expr: "tennis_signal_value{signal=\"parser_duplicate_selection_ids\"} > 0"
        labels:
          severity: "critical"
          rule_id: "parser-duplicate-selections"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "SOURCE_STOP"
        annotations:
          summary: "Duplicate selection IDs make quote identity ambiguous."
          scope: "{{ $labels.scope }}"
      - alert: "TennisParserDuplicateSelectionsTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"parser_duplicate_selection_ids\"} unless on (signal, scope) tennis_signal_value{signal=\"parser_duplicate_selection_ids\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"parser_duplicate_selection_ids\"} > 900)"
        labels:
          severity: "critical"
          rule_id: "parser-duplicate-selections"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
          control: "SOURCE_STOP"
        annotations:
          summary: "Signal parser_duplicate_selection_ids is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
      - alert: "TennisParserUnknownLabels"
        expr: "tennis_signal_value{signal=\"parser_unknown_label_rate\"} > 0.02"
        labels:
          severity: "warning"
          rule_id: "parser-unknown-labels"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "NONE"
        annotations:
          summary: "Unknown market labels. Proposed F05 parser-drift threshold."
          scope: "{{ $labels.scope }}"
      - alert: "TennisParserUnknownLabelsTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"parser_unknown_label_rate\"} unless on (signal, scope) tennis_signal_value{signal=\"parser_unknown_label_rate\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"parser_unknown_label_rate\"} > 900)"
        labels:
          severity: "warning"
          rule_id: "parser-unknown-labels"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "Signal parser_unknown_label_rate is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
      - alert: "TennisParserVolumeChange"
        expr: "tennis_signal_value{signal=\"parser_volume_change\"} > 0.50"
        labels:
          severity: "warning"
          rule_id: "parser-volume-change"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "NONE"
        annotations:
          summary: "Event count changed by more than half against the baseline."
          scope: "{{ $labels.scope }}"
      - alert: "TennisParserVolumeChangeTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"parser_volume_change\"} unless on (signal, scope) tennis_signal_value{signal=\"parser_volume_change\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"parser_volume_change\"} > 900)"
        labels:
          severity: "warning"
          rule_id: "parser-volume-change"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "Signal parser_volume_change is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
      - alert: "TennisSourceStale"
        expr: "tennis_signal_value{signal=\"source_observation_age_seconds\"} > 600"
        labels:
          severity: "warning"
          rule_id: "source-stale"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "NONE"
        annotations:
          summary: "One source is temporarily unavailable. F14 read checks already block stale quotes."
          scope: "{{ $labels.scope }}"
      - alert: "TennisSourceStaleTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"source_observation_age_seconds\"} unless on (signal, scope) tennis_signal_value{signal=\"source_observation_age_seconds\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"source_observation_age_seconds\"} > 900)"
        labels:
          severity: "warning"
          rule_id: "source-stale"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "Signal source_observation_age_seconds is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
      - alert: "TennisStalePublication"
        expr: "tennis_signal_value{signal=\"stale_publication_count\"} > 0"
        labels:
          severity: "critical"
          rule_id: "stale-publication"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "GLOBAL_STOP"
        annotations:
          summary: "A recommendation was published from stale odds. Blueprint section 34.5, critical."
          scope: "{{ $labels.scope }}"
      - alert: "TennisStalePublicationTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"stale_publication_count\"} unless on (signal, scope) tennis_signal_value{signal=\"stale_publication_count\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"stale_publication_count\"} > 900)"
        labels:
          severity: "critical"
          rule_id: "stale-publication"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "Signal stale_publication_count is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
      - alert: "TennisSettlementMismatch"
        expr: "tennis_signal_value{signal=\"settlement_mismatch_count\"} > 0"
        labels:
          severity: "critical"
          rule_id: "settlement-mismatch"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "GLOBAL_STOP"
        annotations:
          summary: "Incorrect settlement or an unbalanced virtual ledger."
          scope: "{{ $labels.scope }}"
      - alert: "TennisSettlementMismatchTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"settlement_mismatch_count\"} unless on (signal, scope) tennis_signal_value{signal=\"settlement_mismatch_count\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"settlement_mismatch_count\"} > 900)"
        labels:
          severity: "critical"
          rule_id: "settlement-mismatch"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "Signal settlement_mismatch_count is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
      - alert: "TennisFutureLeakage"
        expr: "tennis_signal_value{signal=\"leakage_test_failures\"} > 0"
        labels:
          severity: "critical"
          rule_id: "future-leakage"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "GLOBAL_STOP"
        annotations:
          summary: "A future-data leakage test failed."
          scope: "{{ $labels.scope }}"
      - alert: "TennisFutureLeakageTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"leakage_test_failures\"} unless on (signal, scope) tennis_signal_value{signal=\"leakage_test_failures\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"leakage_test_failures\"} > 900)"
        labels:
          severity: "critical"
          rule_id: "future-leakage"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "Signal leakage_test_failures is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
      - alert: "TennisPayoutInconsistency"
        expr: "tennis_signal_value{signal=\"payout_inconsistency_count\"} > 0"
        labels:
          severity: "critical"
          rule_id: "payout-inconsistency"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "GLOBAL_STOP"
        annotations:
          summary: "The tax or payout engine gave inconsistent results."
          scope: "{{ $labels.scope }}"
      - alert: "TennisPayoutInconsistencyTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"payout_inconsistency_count\"} unless on (signal, scope) tennis_signal_value{signal=\"payout_inconsistency_count\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"payout_inconsistency_count\"} > 900)"
        labels:
          severity: "critical"
          rule_id: "payout-inconsistency"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "Signal payout_inconsistency_count is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
      - alert: "TennisIdentityReviewQueue"
        expr: "tennis_signal_value{signal=\"identity_review_queue_size\"} > 50"
        labels:
          severity: "warning"
          rule_id: "identity-review-queue"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "NONE"
        annotations:
          summary: "The identity review queue is growing."
          scope: "{{ $labels.scope }}"
      - alert: "TennisIdentityReviewQueueTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"identity_review_queue_size\"} unless on (signal, scope) tennis_signal_value{signal=\"identity_review_queue_size\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"identity_review_queue_size\"} > 900)"
        labels:
          severity: "warning"
          rule_id: "identity-review-queue"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
          control: "NONE"
        annotations:
          summary: "Signal identity_review_queue_size is missing or older than 900 s. Missing telemetry is not healthy."
          scope: "{{ $labels.scope }}"
      - alert: "TennisFeatureMissingness"
        expr: "tennis_signal_value{signal=\"feature_missing_rate\"} > 0.20"
        labels:
          severity: "warning"
          rule_id: "feature-missingness"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "NONE"
        annotations:
          summary: "Feature missingness increased."
          scope: "{{ $labels.scope }}"
      - alert: "TennisFeatureMissingnessTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"feature_missing_rate\"} unless on (signal, scope) tennis_signal_value{signal=\"feature_missing_rate\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"feature_missing_rate\"} > 900)"
        labels:
          severity: "warning"
          rule_id: "feature-missingness"
          rule_set: "f15-alert-rules-v1"
          reason: "TELEMETRY_MISSING"
