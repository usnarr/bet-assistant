      - alert: "TennisModelProbabilityDrift"
        expr: "tennis_signal_value{signal=\"model_probability_psi\"} > 0.25"
        labels:
          severity: "warning"
          rule_id: "model-probability-drift"
          rule_set: "f15-alert-rules-v1"
          reason: "THRESHOLD"
          control: "NONE"
        annotations:
