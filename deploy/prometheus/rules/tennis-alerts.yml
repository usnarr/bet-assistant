          scope: "{{ $labels.scope }}"
      - alert: "TennisModelProbabilityDriftTelemetryMissing"
        expr: "(tennis_signal_expected{signal=\"model_probability_psi\"} unless on (signal, scope) tennis_signal_value{signal=\"model_probability_psi\"}) or on (signal, scope) (time() - tennis_signal_observed_timestamp_seconds{signal=\"model_probability_psi\"} > 900)"
        labels:
          severity: "warning"
