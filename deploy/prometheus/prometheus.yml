# F15.3 Prometheus scrape and alerting configuration for the single-host Compose stack.
# Every target is on the internal "monitoring" network. No target is on the internet.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: tennis-api
    metrics_path: /metrics
    # An operator token from a Compose secret. The API stores only its digest.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus_api_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: tennis-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduler:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
