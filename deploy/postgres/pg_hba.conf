# F15.5/F15.7 client authentication for the Compose PostgreSQL service.
# TYPE  DATABASE     USER            ADDRESS   METHOD
# Socket connections inside the container only (entrypoint, healthcheck, restore).
local   all          all                       trust
local   replication  all                       trust
# Base backups over the network: the backup role only, with a password.
host    replication  tennis_backup   all       scram-sha-256
# Every other network connection needs a password.
host    all          all             all       scram-sha-256
