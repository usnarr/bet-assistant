name: tennis-engine

x-app-environment: &app-environment
  TENNIS_ENVIRONMENT: ${TENNIS_ENVIRONMENT:-development}
  TENNIS_DATABASE_URL: ${TENNIS_DATABASE_URL:-postgresql+psycopg://tennis:local-only@postgres:5432/tennis}
  TENNIS_OBJECT_STORE_ENDPOINT: ${TENNIS_OBJECT_STORE_ENDPOINT:-object-store:9000}
  TENNIS_OBJECT_STORE_ACCESS_KEY: ${TENNIS_OBJECT_STORE_ACCESS_KEY:-local-development}
  TENNIS_OBJECT_STORE_SECRET_KEY: ${TENNIS_OBJECT_STORE_SECRET_KEY:-change-me-before-use}
  TENNIS_OBJECT_STORE_BUCKET: ${TENNIS_OBJECT_STORE_BUCKET:-tennis-raw}
  TENNIS_OBJECT_STORE_SECURE: ${TENNIS_OBJECT_STORE_SECURE:-false}
  TENNIS_ARTIFACT_ROOT: ${TENNIS_ARTIFACT_ROOT:-/app/var/artifacts}
  TENNIS_LOG_LEVEL: ${TENNIS_LOG_LEVEL:-INFO}
  TENNIS_WORKER_POLL_SECONDS: ${TENNIS_WORKER_POLL_SECONDS:-5}
  # F14 serving. The API opens the governance journal read-only.
  TENNIS_SERVING_ENABLED: ${TENNIS_SERVING_ENABLED:-true}
  TENNIS_API_CREDENTIALS_FILE: /app/var/serving/api-credentials.json
  TENNIS_GOVERNANCE_JOURNAL: /app/var/governance/governance.sqlite3

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    # Start as the postgres user (UID 70). The entrypoint then never runs gosu.
    user: "70:70"
    # F15.7 continuous WAL archiving to the backup volume (docs/operations/README.md).
    command:
      - postgres
      - -c
      - hba_file=/etc/tennis-postgres/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - archive_command=sh /etc/tennis-postgres/archive-wal.sh %p %f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tennis}
      POSTGRES_USER: ${POSTGRES_USER:-tennis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    secrets:
      - postgres_backup_password
    healthcheck:
      # TCP, not the socket: the first-start init server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backup:/backup
      - ./deploy/postgres:/etc/tennis-postgres:ro
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    depends_on:
      backup-init:
        condition: service_completed_successfully

  backup-init:
    # Creates the backup directories with their owners: PostgreSQL (UID 70) writes the WAL
    # archive and base backups; the scheduler (UID 10001) writes object and journal copies
    # and reads the base backup markers. The base directory is setgid group 10001, so each
    # backup directory inherits that group. Only the markers are group-readable.
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        install -d -o 70 -g 70 -m 0700 /pg-backup/wal
        && install -d -o 70 -g 10001 -m 2750 /pg-backup/base
        && install -d -o 10001 -g 10001 -m 0700 /app-backup/objects /app-backup/journal
    volumes:
      - postgres-backup:/pg-backup
      - app-backup:/app-backup
    restart: "no"

  postgres-backup:
    # F15.7 daily base backups with retention (deploy/postgres/base-backup.sh).
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    user: "70:70"
    entrypoint: ["sh", "/etc/tennis-postgres/base-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: tennis_backup
      PGDATABASE: ${POSTGRES_DB:-tennis}
      PGPASSWORD_FILE: /run/secrets/postgres_backup_password
      BACKUP_ROOT: /backup
      BASE_BACKUP_INTERVAL_SECONDS: "86400"
      BASE_BACKUP_KEEP: "7"
    secrets:
      - postgres_backup_password
    volumes:
      - postgres-backup:/backup
      - ./deploy/postgres:/etc/tennis-postgres:ro
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /backup/base -name COMPLETE -mmin -1560 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 5m

  object-store:
    # SeaweedFS all-in-one server; only its S3 gateway is published.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: mini -dir=/data -s3.port=9000
    environment:
      AWS_ACCESS_KEY_ID: ${TENNIS_OBJECT_STORE_ACCESS_KEY:-local-development}
      AWS_SECRET_ACCESS_KEY: ${TENNIS_OBJECT_STORE_SECRET_KEY:-change-me-before-use}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - object-store-data:/data

  migrate:
    build: .
    command: alembic upgrade head
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  object-store-init:
    build: .
    command: tennis-platform init-object-store
    environment: *app-environment
    depends_on: [object-store]
    restart: on-failure

  governance-init:
    # Creates an empty F01 journal if missing. Empty means every permission is denied.
    build: .
    command: >-
      tennis-governance --database /app/var/governance/governance.sqlite3
      --access-file /app/var/governance/governance-access.json init
    environment: *app-environment
    volumes:
      - governance-data:/app/var/governance
    restart: "no"

  api:
    build: .
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    # Read-only mounts: the API cannot change policy, stops or credentials.
    volumes:
      - governance-data:/app/var/governance:ro
      - serving-config:/app/var/serving:ro
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
      governance-init:
        condition: service_completed_successfully
      monitoring-token:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  scheduler:
    # F15 scheduler (ADR 0005): the job graph, alert evaluation and deterministic stops.
    build: .
    command: >-
      tennis-ops scheduler --tick-seconds 60 --metrics-port 9101
      --signal-inbox /app/var/signals
      --backup-root /backup/app --postgres-backup-root /backup/postgres
    environment: *app-environment
    # The journal mount is writable: a critical alert appends a stop. Nothing resumes.
    # The scheduler copies raw objects and journal snapshots to the backup volume every
    # 5 minutes and reads the PostgreSQL backup markers.
    volumes:
      - governance-data:/app/var/governance
      - signal-inbox:/app/var/signals
      - app-backup:/backup/app
      - postgres-backup:/backup/postgres:ro
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
      governance-init:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
      backup-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/health')"]
      interval: 10s
      timeout: 3s
      retries: 20

  monitoring-token:
    # Stores the digest of the Prometheus scrape token (an operator token) before the
    # API starts. The plain token stays in the Compose secret.
    build: .
    command: >-
      tennis-platform register-api-token --identity prometheus --role operator
      --token-file /run/secrets/prometheus_api_token
    environment: *app-environment
    secrets:
      - prometheus_api_token
    volumes:
      - serving-config:/app/var/serving
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=:9090
    secrets:
      - prometheus_api_token
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 20

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    read_only: true

  grafana:
    # Read-only dashboard. Anonymous visitors are viewers; provisioned items cannot change.
    image: grafana/grafana:13.0.10-distroless-slim@sha256:c61d1d0e2408bc536c44cd8df25066956dbac6113cf864a55d6c300aa57f01e1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/tennis-operations.json
    secrets:
      - grafana_admin_password
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp

  admin:
    # Operator commands only, for example:
    # docker compose run --rm admin tennis-platform create-api-token --identity ops --role operator
    build: .
    command: tennis-platform show-config
    environment: *app-environment
    volumes:
      - governance-data:/app/var/governance
      - serving-config:/app/var/serving
    profiles: ["admin"]
    restart: "no"

volumes:
  postgres-data:
  object-store-data:
  governance-data:
  serving-config:
  signal-inbox:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  # F15.7 backup volumes. Keep them on a separate encrypted disk (see docs/operations/README.md).
  postgres-backup:
  app-backup:

# Local files from `scripts/init_local_secrets.py`. Production supplies them from the
# host's secret manager. The directory is ignored by Git and Docker.
secrets:
  prometheus_api_token:
    file: ${TENNIS_SECRETS_DIR:-./secrets}/prometheus-api-token
  grafana_admin_password:
    file: ${TENNIS_SECRETS_DIR:-./secrets}/grafana-admin-password
  postgres_backup_password:
    file: ${TENNIS_SECRETS_DIR:-./secrets}/postgres-backup-password
